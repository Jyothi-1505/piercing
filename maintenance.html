<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AURIA is currently undergoing a little refinement."
    >

    <link
        rel="icon"
        type="image/png"
        href="./assets/images/logo/auria-logo.png"
    >

    <title>Maintenance | AURIA</title>


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./assets/css/global.css"
    >


    <!-- =====================================================
         MAINTENANCE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./assets/css/maintenance.css"
    >


    <!-- =====================================================
         LUCIDE
    ====================================================== -->

    <script
        src="https://unpkg.com/lucide@latest"
        defer
    ></script>


    <!-- =====================================================
         MAINTENANCE JS
    ====================================================== -->

    <script
        src="./assets/js/maintenance.js"
        defer
    ></script>

</head>


<body class="maintenance-page">


    <!-- =====================================================
         FIXED CONTROLS
         SAME GLOBAL CONTROLS AS OTHER STANDALONE PAGES
    ====================================================== -->

    <div
        class="maintenance-page__controls"
        aria-label="Page controls"
    >

        <button
            class="header-action"
            id="rtl-toggle"
            type="button"
            aria-label="Switch layout direction"
        >
            RTL
        </button>


        <button
            class="header-action header-action--theme"
            id="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
        >

            <i
                data-lucide="moon"
                class="theme-icon theme-icon--moon"
            ></i>

            <i
                data-lucide="sun"
                class="theme-icon theme-icon--sun"
            ></i>

        </button>

    </div>



    <!-- =====================================================
         MAINTENANCE MAIN
    ====================================================== -->

    <main class="maintenance-page__main">

        <section
            class="maintenance-card"
            aria-labelledby="maintenance-title"
        >


            <!-- =================================================
                 BRAND
            ================================================== -->

            <a
                href="./index.html"
                class="brand-logo maintenance-card__brand"
                aria-label="AURIA Home"
            >

                <span class="brand-logo__image">

                    <img
                        src="./assets/images/logo/auria-logo.png"
                        alt="AURIA logo"
                    >

                </span>


                <span class="brand-logo__content">

                    <span class="brand-logo__main">

                        <span class="brand-logo__primary">
                            AU
                        </span>

                        <span class="brand-logo__secondary">
                            RIA
                        </span>

                    </span>


                    <span class="brand-logo__tagline">
                        PIERCING &amp; JEWELRY
                    </span>

                </span>

            </a>



            <!-- =================================================
                 VISUAL
            ================================================== -->

            <div
                class="maintenance-card__visual"
                aria-hidden="true"
            >

                <div class="maintenance-card__visual-ring">

                    <span class="maintenance-card__visual-dot"></span>

                    <i data-lucide="sparkles"></i>

                </div>


                <span class="maintenance-card__visual-line"></span>

                <span class="maintenance-card__visual-label">
                    AURIA / IN PROGRESS
                </span>

            </div>



            <!-- =================================================
                 EYEBROW
            ================================================== -->

            <span class="maintenance-card__eyebrow">
                A LITTLE PAUSE
            </span>



            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1
                class="maintenance-card__title"
                id="maintenance-title"
            >

                We're refining
                <span>the experience.</span>

            </h1>



            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <p class="maintenance-card__description">

                AURIA is currently taking a little time
                to refine the experience. We'll be back
                shortly with something worth the wait.

            </p>



            <!-- =================================================
                 STATUS
            ================================================== -->

            <div class="maintenance-card__status">

                <span class="maintenance-card__status-dot"></span>

                <span>
                    CURRENTLY BEING UPDATED
                </span>

            </div>



            <!-- =================================================
                 ACTION
            ================================================== -->

            <div class="maintenance-card__actions">

                <a
                    href="./index.html"
                    class="btn btn-primary"
                >

                    <span>
                        Back to Home
                    </span>

                    <i data-lucide="arrow-up-right"></i>

                </a>

            </div>



            <!-- =================================================
                 BOTTOM
            ================================================== -->

            <div class="maintenance-card__bottom">

                <div class="maintenance-card__bottom-left">

                    <span>
                        REFINING
                    </span>

                    <span>
                        CURATING
                    </span>

                    <span>
                        PERFECTING
                    </span>

                </div>


                <span class="maintenance-card__bottom-brand">
                    AURIA
                </span>

            </div>

        </section>

    </main>

</body>

</html>
